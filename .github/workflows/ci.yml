name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    name: Suite completa
    runs-on: ubuntu-latest

    # Postgres de verdad: los tests del motor no sirven contra un simulacro.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notarum
          POSTGRES_PASSWORD: notarum
          POSTGRES_DB: notarum
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Formato
        run: |
          sin_formatear=$(gofmt -l .)
          if [ -n "$sin_formatear" ]; then
            echo "Estos archivos no están formateados:"
            echo "$sin_formatear"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Los tests de unidad usan fixtures HTML reales guardados en el repo:
      # no salen a la red, así que corren igual de rápido acá que en local.
      - name: Tests
        env:
          NOTARUM_TEST_POSTGRES: postgres://notarum:notarum@localhost:5432/notarum?sslmode=disable
        run: go test -race ./...

      # Construirla no alcanza: lo que falla en un despliegue de verdad es el
      # volumen. El panel lo crea como root, notarum corre sin privilegios, y
      # si el arranque no acomoda los permisos el servicio no levanta —con los
      # datos perdiéndose en cada despliegue mientras tanto, que es peor.
      - name: Que la imagen arranque con un volumen montado, como en un panel
        run: |
          docker build -t notarum:ci .
          sudo mkdir -p /tmp/datos-de-root
          sudo chown root:root /tmp/datos-de-root
          docker run -d --name notarum-ci -p 8080:8080             -v /tmp/datos-de-root:/datos             -e NOTARUM_ALMACEN=sqlite             -e NOTARUM_ADMIN_CLAVE=una-clave-larga-para-la-prueba             notarum:ci

          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/v1/salud >/dev/null && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/v1/salud; then
            echo "no levantó; esto dijo:"
            docker logs notarum-ci
            exit 1
          fi

          # Y que haya podido escribir de verdad en el volumen: levantar sin
          # poder guardar nada sería el mismo problema con otra cara.
          if ! sudo test -s /tmp/datos-de-root/notarum.db; then
            echo "levantó pero no escribió la base en el volumen:"
            sudo ls -la /tmp/datos-de-root
            docker logs notarum-ci
            exit 1
          fi

          # El servicio, corriendo sin privilegios. Se mira el proceso 1 y no
          # "docker exec id": exec arranca un proceso nuevo con el usuario de
          # la imagen —root, que es de donde el arranque se baja— y contestaba
          # root aunque el servicio estuviera bien.
          quien=$(docker exec notarum-ci stat -c %U /proc/1)
          if [ "$quien" != "notarum" ]; then
            echo "el servicio quedó corriendo como $quien"
            docker exec notarum-ci ps -o user,pid,comm || true
            exit 1
          fi
          docker rm -f notarum-ci

  # Los tests con la etiqueta `red` pegan al sitio real del Boletín Oficial.
  # No corren en cada push: se disparan a mano o una vez por día, y sirven para
  # enterarse de que el sitio cambió de forma antes de que lo note quien
  # consume la API. Que fallen no rompe un pull request.
  contra-el-sitio:
    name: Contra el sitio real
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test -tags red -v -timeout 10m ./internal/boletin/

  # Publicar la imagen. Antes salía de la máquina de quien tuviera Docker
  # prendido, que es una forma de que la versión publicada dependa de dónde se
  # apretó el botón. Acá sale del mismo commit que pasó los tests, siempre.
  publicar:
    name: Publicar la imagen
    needs: probar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # La versión sale del binario y no de una constante escrita a mano acá:
      # dos lugares con el mismo número se desincronizan.
      - name: Sacar la versión del código
        id: version
        run: |
          v=$(grep -oP 'var version = "\K[^"]+' cmd/notarum/main.go)
          echo "numero=$v" >> "$GITHUB_OUTPUT"
          echo "notarum $v"

      # El driver por defecto no sabe exportar caché: sin esto el build falla
      # antes de empezar.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VERSION=${{ steps.version.outputs.numero }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.numero }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
